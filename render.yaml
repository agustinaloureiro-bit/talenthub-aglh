services:
  - type: web
    name: talenthub-aglh
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://talenthub-aglh.onrender.com/api/auth/google/callback
      - key: ALLOWED_GOOGLE_DOMAINS
        value: aglh.com.uy,yoiners.com
      - key: CORS_ORIGIN
        value: https://talenthub-aglh.onrender.com
      - key: SERVE_STATIC
        value: "true"
